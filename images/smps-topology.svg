<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e3a5f">开关电源拓扑家族：功率决定选型</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#64748b">拓扑 = 开关管、变压器、二极管的连接方式，决定了电源能做强、能传多少功率</text>

  <!-- 表头 -->
  <rect x="30" y="95" width="900" height="42" rx="6" fill="#1e3a5f"/>
  <text x="120" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">拓扑</text>
  <text x="300" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">功率范围</text>
  <text x="470" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">核心特点</text>
  <text x="720" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">典型应用</text>

  <!-- 反激 -->
  <rect x="30" y="137" width="900" height="66" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="30" y="137" width="180" height="66" fill="#dbeafe"/>
  <text x="120" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e40af">反激 Flyback</text>
  <text x="120" y="191" text-anchor="middle" font-size="11" fill="#64748b">最常用</text>
  <text x="300" y="178" text-anchor="middle" font-size="13" fill="#334155">&lt; 150W</text>
  <text x="470" y="163" text-anchor="middle" font-size="12" fill="#475569">变压器兼储能电感，结构简单</text>
  <text x="470" y="185" text-anchor="middle" font-size="12" fill="#475569">单开关管，成本最低</text>
  <text x="720" y="163" text-anchor="middle" font-size="12" fill="#334155">手机充电器、适配器</text>
  <text x="720" y="185" text-anchor="middle" font-size="12" fill="#334155">小功率辅助电源</text>

  <!-- 正激 -->
  <rect x="30" y="203" width="900" height="66" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="30" y="203" width="180" height="66" fill="#e0f2fe"/>
  <text x="120" y="236" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e7490">正激 Forward</text>
  <text x="120" y="257" text-anchor="middle" font-size="11" fill="#64748b">变压器不储能</text>
  <text x="300" y="244" text-anchor="middle" font-size="13" fill="#334155">100~500W</text>
  <text x="470" y="229" text-anchor="middle" font-size="12" fill="#475569">需复位绕组，占空比 &lt; 50%</text>
  <text x="470" y="251" text-anchor="middle" font-size="12" fill="#475569">输出加滤波电感</text>
  <text x="720" y="229" text-anchor="middle" font-size="12" fill="#334155">通信电源、工业电源</text>
  <text x="720" y="251" text-anchor="middle" font-size="12" fill="#334155">中等功率模块</text>

  <!-- 推挽/半桥 -->
  <rect x="30" y="269" width="900" height="66" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="30" y="269" width="180" height="66" fill="#fef3c7"/>
  <text x="120" y="302" text-anchor="middle" font-size="16" font-weight="bold" fill="#b45309">推挽 / 半桥</text>
  <text x="120" y="323" text-anchor="middle" font-size="11" fill="#64748b">双开关管</text>
  <text x="300" y="310" text-anchor="middle" font-size="13" fill="#334155">300~1000W</text>
  <text x="470" y="295" text-anchor="middle" font-size="12" fill="#475569">两只开关管交替导通</text>
  <text x="470" y="317" text-anchor="middle" font-size="12" fill="#475569">利用率高，变压器偏置要平衡</text>
  <text x="720" y="295" text-anchor="middle" font-size="12" fill="#334155">焊机、大功率适配器</text>
  <text x="720" y="317" text-anchor="middle" font-size="12" fill="#334155">逆变电源</text>

  <!-- 全桥/LLC -->
  <rect x="30" y="335" width="900" height="66" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="30" y="335" width="180" height="66" fill="#fee2e2"/>
  <text x="120" y="368" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">全桥 / LLC</text>
  <text x="120" y="389" text-anchor="middle" font-size="11" fill="#64748b">四开关管 + 谐振</text>
  <text x="300" y="376" text-anchor="middle" font-size="13" fill="#334155">&gt; 1kW</text>
  <text x="470" y="361" text-anchor="middle" font-size="12" fill="#475569">全桥四管，功率最大</text>
  <text x="470" y="383" text-anchor="middle" font-size="12" fill="#475569">LLC 软开关，效率可达 95%+</text>
  <text x="720" y="361" text-anchor="middle" font-size="12" fill="#334155">服务器电源、充电桩</text>
  <text x="720" y="383" text-anchor="middle" font-size="12" fill="#334155">通信基站、数据中心</text>

  <!-- 底部 -->
  <rect x="30" y="420" width="900" height="80" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="50" y="447" font-size="14" font-weight="bold" fill="#b45309">选型口诀</text>
  <text x="50" y="472" font-size="13" fill="#78350f">小功率反激走天下，中等功率正激/半桥顶上，千瓦级以上全桥加 LLC；功率越大拓扑越复杂，成本和设计难度同步上升。</text>
  <text x="50" y="492" font-size="12" fill="#92400e">注：功率范围是经验值，实际边界随拓扑改进和器件性能浮动。</text>
</svg>
