<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="660" fill="#F8FAFC"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0F172A">四类接入方式：都走 9000，9001 只给人看</text>
  <text x="40" y="76" font-size="14" fill="#64748B">程序、命令行、备份工具统一访问 S3 API；Nginx 在前做 TLS 终止与域名分离</text>

  <!-- 四个来源 -->
  <rect x="40" y="120" width="250" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="60" y="150" font-size="14" font-weight="700" fill="#1E40AF">mc 命令行</text>
  <text x="60" y="176" font-size="11" fill="#475569">运维、批处理、备份</text>

  <rect x="40" y="220" width="250" height="76" rx="10" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="60" y="250" font-size="14" font-weight="700" fill="#3730A3">S3 SDK</text>
  <text x="60" y="276" font-size="11" fill="#475569">boto3 / Spring Boot / Go</text>

  <rect x="40" y="320" width="250" height="76" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="60" y="350" font-size="14" font-weight="700" fill="#15803D">rclone</text>
  <text x="60" y="376" font-size="11" fill="#475569">挂载 / 同步 / 备份</text>

  <rect x="40" y="420" width="250" height="76" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
  <text x="60" y="450" font-size="14" font-weight="700" fill="#9D174D">浏览器</text>
  <text x="60" y="476" font-size="11" fill="#475569">人，管理控制台</text>

  <!-- arrows -->
  <line x1="292" y1="158" x2="470" y2="290" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="292" y1="258" x2="470" y2="310" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="292" y1="358" x2="470" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="292" y1="458" x2="700" y2="500" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <!-- Nginx reverse proxy -->
  <rect x="475" y="270" width="230" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="495" y="298" font-size="14" font-weight="700" fill="#334155">Nginx / Caddy 反代</text>
  <text x="495" y="322" font-size="11" fill="#475569">TLS 终止 · 域名分离</text>
  <text x="495" y="344" font-size="11" fill="#DC2626">client_max_body_size 0</text>
  <text x="495" y="362" font-size="11" fill="#DC2626">proxy_set_header Host $http_host</text>

  <line x1="708" y1="320" x2="790" y2="320" stroke="#64748B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ports -->
  <rect x="795" y="240" width="180" height="76" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="815" y="268" font-size="15" font-weight="700" fill="#1E40AF">:9000 API</text>
  <text x="815" y="294" font-size="11" fill="#475569">s3.example.com</text>

  <rect x="795" y="330" width="180" height="76" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="815" y="358" font-size="15" font-weight="700" fill="#9A3412">:9001 Console</text>
  <text x="815" y="384" font-size="11" fill="#475569">minio.example.com</text>

  <line x1="975" y1="278" x2="1055" y2="278" stroke="#2563EB" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="975" y1="368" x2="1055" y2="368" stroke="#EA580C" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="1060" y="240" width="100" height="166" rx="10" fill="#0F172A"/>
  <text x="1110" y="290" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">MinIO</text>
  <text x="1110" y="316" font-size="11" fill="#93C5FD" text-anchor="middle">Server</text>
  <text x="1110" y="344" font-size="11" fill="#93C5FD" text-anchor="middle">对象</text>
  <text x="1110" y="368" font-size="11" fill="#93C5FD" text-anchor="middle">存储</text>

  <!-- bottom notes -->
  <rect x="40" y="522" width="540" height="112" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="552" font-size="14" font-weight="700" fill="#0F172A">SDK 必开 path-style</text>
  <text x="60" y="580" font-size="12" fill="#475569">Python：Config(s3={"addressing_style": "path"})</text>
  <text x="60" y="604" font-size="12" fill="#475569">Java：endpoint 填 API 地址，不带 bucket 名</text>
  <text x="60" y="624" font-size="11" fill="#64748B">region 随便填 us-east-1，MinIO 忽略但 SDK 要求有</text>

  <rect x="600" y="522" width="560" height="112" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
  <text x="620" y="552" font-size="14" font-weight="700" fill="#B91C1C">常见错法</text>
  <text x="620" y="580" font-size="12" fill="#7F1D1D">把 SDK 指到 9001 → 返回一堆看不懂的 XML</text>
  <text x="620" y="604" font-size="12" fill="#7F1D1D">反代改了 Host → SignatureDoesNotMatch</text>
  <text x="620" y="624" font-size="12" fill="#7F1D1D">直接 -p 9000:9000 → 绕过 ufw/firewalld 暴露公网</text>
</svg>
