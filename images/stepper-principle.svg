<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e3a5f">步进电机工作原理：一个脉冲，走一步</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#64748b">控制器发脉冲 → 驱动器放大并分配电流 → 电机按固定角度一步一步转动</text>

  <!-- 信号链 -->
  <rect x="25" y="150" width="150" height="110" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="100" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e7490">控制器</text>
  <text x="100" y="206" text-anchor="middle" font-size="12" fill="#64748b">PLC / 单片机</text>
  <text x="100" y="228" text-anchor="middle" font-size="12" fill="#64748b">发脉冲信号</text>
  <text x="100" y="250" text-anchor="middle" font-size="11" fill="#94a3b8">PUL / DIR</text>

  <line x1="175" y1="205" x2="235" y2="205" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="205" y="192" text-anchor="middle" font-size="11" fill="#0891b2">脉冲</text>

  <rect x="238" y="150" width="165" height="110" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="320" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#0e7490">驱动器</text>
  <text x="320" y="206" text-anchor="middle" font-size="12" fill="#64748b">放大电流</text>
  <text x="320" y="228" text-anchor="middle" font-size="12" fill="#64748b">分配相序</text>
  <text x="320" y="250" text-anchor="middle" font-size="11" fill="#94a3b8">A+ A- B+ B-</text>

  <line x1="403" y1="205" x2="463" y2="205" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="433" y="192" text-anchor="middle" font-size="11" fill="#0891b2">相电流</text>

  <!-- 电机 -->
  <rect x="466" y="140" width="200" height="130" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  <text x="566" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">步进电机</text>
  <circle cx="566" cy="220" r="34" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
  <line x1="566" y1="220" x2="566" y2="190" stroke="#ea580c" stroke-width="3"/>
  <line x1="566" y1="220" x2="590" y2="234" stroke="#ea580c" stroke-width="3"/>
  <text x="566" y="263" text-anchor="middle" font-size="11" fill="#c2410c">转子按步距角转动</text>

  <line x1="666" y1="205" x2="726" y2="205" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="696" y="192" text-anchor="middle" font-size="11" fill="#c2410c">机械输出</text>

  <rect x="729" y="150" width="200" height="110" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  <text x="829" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">负载</text>
  <text x="829" y="206" text-anchor="middle" font-size="12" fill="#64748b">丝杆 / 皮带 / 转台</text>
  <text x="829" y="228" text-anchor="middle" font-size="12" fill="#64748b">精确定位</text>

  <!-- 步距角示意 -->
  <rect x="25" y="300" width="904" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="45" y="328" font-size="15" font-weight="bold" fill="#1e3a5f">核心关系：脉冲数决定位置，脉冲频率决定速度</text>
  <text x="45" y="356" font-size="13" fill="#475569">• 步距角：每来一个脉冲，转子转过的固定角度（常见 1.8°，即一圈 200 步）</text>
  <text x="45" y="380" font-size="13" fill="#475569">• 位置 = 脉冲数 × 步距角　　转速 = 脉冲频率 × 步距角 × 60 / 360</text>
  <text x="45" y="404" font-size="13" fill="#475569">• 例：1.8° 电机，发 200 个脉冲转一圈；每秒发 1000 个脉冲 = 300 转/分</text>
  <text x="45" y="428" font-size="13" fill="#b91c1c">• 开环控制：发出脉冲就认为走到了，不反馈实际位置——所以会「丢步」</text>
</svg>
