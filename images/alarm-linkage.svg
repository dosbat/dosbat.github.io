<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e3a5f">动环验收：逐点触发，看完整链路</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#64748b">不是「装了传感器」就完事 —— 每个点位都要走完触发到恢复的闭环</text>

  <!-- 五步主链 -->
  <rect x="30" y="130" width="160" height="96" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="110" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">① 逐点触发</text>
  <text x="110" y="188" text-anchor="middle" font-size="11" fill="#64748b">水浸：湿棉触碰</text>
  <text x="110" y="208" text-anchor="middle" font-size="11" fill="#64748b">烟感：测试气雾</text>

  <rect x="220" y="130" width="160" height="96" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="300" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">② 看平台</text>
  <text x="300" y="188" text-anchor="middle" font-size="11" fill="#64748b">点位编号正确</text>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#64748b">告警内容准确</text>

  <rect x="410" y="130" width="160" height="96" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="490" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">③ 看推送</text>
  <text x="490" y="188" text-anchor="middle" font-size="11" fill="#64748b">短信/电话/企微</text>
  <text x="490" y="208" text-anchor="middle" font-size="11" fill="#64748b">声光、工单</text>

  <rect x="600" y="130" width="160" height="96" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="680" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">④ 看升级</text>
  <text x="680" y="188" text-anchor="middle" font-size="11" fill="#64748b">超时未处理</text>
  <text x="680" y="208" text-anchor="middle" font-size="11" fill="#64748b">告警升级到人</text>

  <rect x="790" y="130" width="140" height="96" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="860" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">⑤ 看恢复</text>
  <text x="860" y="188" text-anchor="middle" font-size="11" fill="#64748b">现场复位</text>
  <text x="860" y="208" text-anchor="middle" font-size="11" fill="#64748b">告警自动清除</text>

  <line x1="190" y1="178" x2="215" y2="178" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="178" x2="405" y2="178" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="178" x2="595" y2="178" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="178" x2="785" y2="178" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 联动测试表 -->
  <rect x="30" y="262" width="560" height="220" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="310" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">联动测试表：每个点位填一行</text>

  <rect x="50" y="310" width="520" height="28" fill="#e0f2fe"/>
  <text x="70" y="329" font-size="12" font-weight="bold" fill="#075985">点位编号</text>
  <text x="200" y="329" font-size="12" font-weight="bold" fill="#075985">触发方式</text>
  <text x="350" y="329" font-size="12" font-weight="bold" fill="#075985">预期显示</text>
  <text x="470" y="329" font-size="12" font-weight="bold" fill="#075985">实测结果</text>

  <g font-size="11" fill="#475569">
    <text x="70" y="360">TH-01</text><text x="200" y="360">加热比对</text><text x="350" y="360">温度&gt;30℃</text><text x="470" y="360">□ 通过</text>
    <text x="70" y="386">WI-02</text><text x="200" y="386">湿棉触碰</text><text x="350" y="386">水浸告警</text><text x="470" y="386">□ 通过</text>
    <text x="70" y="412">AC-03</text><text x="200" y="412">模拟市电断</text><text x="350" y="412">转电池告警</text><text x="470" y="412">□ 通过</text>
    <text x="70" y="438">DH-04</text><text x="200" y="438">门开超时</text><text x="350" y="438">门禁告警</text><text x="470" y="438">□ 通过</text>
  </g>
  <text x="70" y="466" font-size="11" fill="#94a3b8">还应有：测试人 / 时间 / 告警恢复记录</text>

  <!-- 右侧必须覆盖 -->
  <rect x="620" y="262" width="310" height="220" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="775" y="292" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">至少覆盖这五种情况</text>
  <text x="640" y="324" font-size="12" fill="#9a3412">1. 告警产生</text>
  <text x="640" y="350" font-size="12" fill="#9a3412">2. 告警升级</text>
  <text x="640" y="376" font-size="12" fill="#9a3412">3. 告警恢复</text>
  <text x="640" y="402" font-size="12" fill="#9a3412">4. 告警去重（不刷屏）</text>
  <text x="640" y="428" font-size="12" fill="#9a3412">5. 平台断电/断网心跳丢失</text>
  <text x="640" y="462" font-size="11" fill="#a16207">录像按码率反算，实测覆盖周期</text>

  <text x="480" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">阈值示例（按项目定）：温度&gt;30℃ · 湿度&gt;70% · 水浸动作 · 市电中断 · UPS转电池 · 门禁未关</text>
</svg>
