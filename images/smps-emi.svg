<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e3a5f">EMI 干扰是怎么产生的，又怎么传出去</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" fill="#64748b">开关电源的高频开关是干扰源，传导和辐射两条路污染电网和周边设备</text>

  <!-- 干扰源 -->
  <rect x="30" y="120" width="185" height="180" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="122" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#b91c1c">干扰源</text>
  <text x="122" y="182" text-anchor="middle" font-size="12" fill="#7f1d1d">MOSFET 高频开关</text>
  <text x="122" y="206" text-anchor="middle" font-size="12" fill="#7f1d1d">陡峭的上升/下降沿</text>
  <text x="122" y="230" text-anchor="middle" font-size="12" fill="#7f1d1d">二极管反向恢复</text>
  <text x="122" y="254" text-anchor="middle" font-size="12" fill="#7f1d1d">变压器漏感尖峰</text>
  <text x="122" y="282" text-anchor="middle" font-size="11" fill="#991b1b">→ 高频噪声 + 电压尖峰</text>

  <!-- 两条路径 -->
  <line x1="215" y1="175" x2="300" y2="175" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="215" y1="245" x2="300" y2="245" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 传导 -->
  <rect x="303" y="140" width="250" height="70" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="428" y="168" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">传导干扰</text>
  <text x="428" y="192" text-anchor="middle" font-size="12" fill="#64748b">沿电线传播（150kHz~30MHz）</text>

  <!-- 辐射 -->
  <rect x="303" y="220" width="250" height="70" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="428" y="248" text-anchor="middle" font-size="15" font-weight="bold" fill="#c2410c">辐射干扰</text>
  <text x="428" y="272" text-anchor="middle" font-size="12" fill="#64748b">空间电磁波（30MHz~1GHz）</text>

  <!-- 受害者 -->
  <line x1="553" y1="175" x2="620" y2="175" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="553" y1="255" x2="620" y2="255" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="623" y="150" width="305" height="140" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <text x="775" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">受害设备</text>
  <text x="775" y="208" text-anchor="middle" font-size="12" fill="#7f1d1d">① 电网其他设备受污染</text>
  <text x="775" y="232" text-anchor="middle" font-size="12" fill="#7f1d1d">② 通信丢包、模拟量跳动</text>
  <text x="775" y="256" text-anchor="middle" font-size="12" fill="#7f1d1d">③ 触摸屏偶发死机</text>
  <text x="775" y="280" text-anchor="middle" font-size="12" fill="#7f1d1d">④ 音频设备嗡嗡噪声</text>

  <!-- 抑制措施 -->
  <rect x="30" y="325" width="898" height="125" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="50" y="353" font-size="15" font-weight="bold" fill="#0e7490">抑制手段（源头 + 路径）</text>
  <text x="50" y="380" font-size="13" fill="#475569">• 输入端 EMI 滤波器：共模电感 + X/Y 电容，挡住噪声进出电网　• RCD 吸收 / 钳位：压住开关管关断尖峰</text>
  <text x="50" y="404" font-size="13" fill="#475569">• 变压器屏蔽绕组：切断初次级间的共模耦合　• 缩短高频回路、减小环路面积：从源头少辐射</text>
  <text x="50" y="428" font-size="13" fill="#475569">• 金属外壳接地 + 输出端滤波：给噪声低阻抗泄放路径　• 放缓开关沿：牺牲一点效率换更低 EMI</text>
</svg>
