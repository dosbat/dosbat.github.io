<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563EB"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#10B981"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#DC2626"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#F8FAFC"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0F172A">Docker 端口为什么绕过 firewalld</text>
  <text x="40" y="76" font-size="14" fill="#64748B">-p 发布的流量走 FORWARD → DOCKER 链，不经过 zone 的 INPUT 规则</text>

  <!-- 普通服务 -->
  <text x="40" y="122" font-size="15" font-weight="700" fill="#047857">普通服务（nginx 直接装在系统上）：zone 规则生效</text>
  <rect x="40" y="138" width="190" height="72" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="135" y="172" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">客户端请求</text>
  <text x="135" y="192" font-size="11" fill="#64748B" text-anchor="middle">公网进来的包</text>
  <line x1="232" y1="174" x2="272" y2="174" stroke="#10B981" stroke-width="2.5" marker-end="url(#arg)"/>
  <rect x="275" y="138" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="375" y="172" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">INPUT 链</text>
  <text x="375" y="192" font-size="11" fill="#64748B" text-anchor="middle">到达本机的数据包</text>
  <line x1="477" y1="174" x2="517" y2="174" stroke="#10B981" stroke-width="2.5" marker-end="url(#arg)"/>
  <rect x="520" y="138" width="280" height="72" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="660" y="172" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">zone 规则（port / 富规则 / ipset）</text>
  <text x="660" y="192" font-size="11" fill="#065F46" text-anchor="middle">在这里被检查</text>
  <line x1="802" y1="174" x2="842" y2="174" stroke="#10B981" stroke-width="2.5" marker-end="url(#arg)"/>
  <rect x="845" y="138" width="315" height="72" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="1002" y="172" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">✓ 访问控制生效</text>
  <text x="1002" y="192" font-size="11" fill="#047857" text-anchor="middle">白名单/限速都按 zone 规则走</text>

  <!-- Docker -->
  <text x="40" y="268" font-size="15" font-weight="700" fill="#B91C1C">Docker 容器 + -p 发布：zone 规则被绕过</text>
  <rect x="40" y="284" width="190" height="72" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="135" y="318" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">客户端请求</text>
  <text x="135" y="338" font-size="11" fill="#64748B" text-anchor="middle">访问宿主机映射端口</text>
  <line x1="232" y1="320" x2="272" y2="320" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="275" y="284" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="375" y="318" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">FORWARD 链</text>
  <text x="375" y="338" font-size="11" fill="#64748B" text-anchor="middle">转发到容器，不走 INPUT</text>
  <line x1="477" y1="320" x2="517" y2="320" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="520" y="284" width="280" height="72" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="660" y="318" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">DOCKER 链（Docker 自写规则）</text>
  <text x="660" y="338" font-size="11" fill="#991B1B" text-anchor="middle">默认 ACCEPT，先于你的规则</text>
  <line x1="802" y1="320" x2="842" y2="320" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="845" y="284" width="315" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="1002" y="318" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle">✗ zone 的 INPUT 规则没机会跑</text>
  <text x="1002" y="338" font-size="11" fill="#7F1D1D" text-anchor="middle">限制显得「完全不生效」</text>

  <!-- 解决方案 -->
  <text x="40" y="418" font-size="16" font-weight="700" fill="#0F172A">两种正确姿势</text>
  <rect x="40" y="434" width="550" height="112" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="62" y="464" font-size="14" font-weight="700" fill="#1E40AF">A · 端口只绑本地（最推荐）</text>
  <text x="62" y="492" font-size="12" fill="#1E3A8A">docker run -d -p 127.0.0.1:8080:80 nginx</text>
  <text x="62" y="516" font-size="11" fill="#475569">公网端口交给 Nginx 反代，访问控制回到 firewalld 手里</text>
  <text x="62" y="534" font-size="11" fill="#475569">云上还可以直接把安全组当第一道门</text>

  <rect x="610" y="434" width="550" height="112" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
  <text x="632" y="464" font-size="14" font-weight="700" fill="#334155">B · 写进 DOCKER-USER 链</text>
  <text x="632" y="492" font-size="12" fill="#0F172A">firewall-cmd --permanent --direct --add-rule ...</text>
  <text x="632" y="516" font-size="11" fill="#475569">Docker 专门留给用户、自身不会覆盖的链</text>
  <text x="632" y="534" font-size="11" fill="#DC2626">注意：匹配容器端口，不是宿主机映射端口</text>

  <rect x="40" y="566" width="1120" height="112" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="60" y="596" font-size="14" font-weight="700" fill="#92400E">两个高频坑</text>
  <text x="60" y="624" font-size="12" fill="#78350F">① 端口映射会做 DNAT：host 8443 → container 443 时，规则里要写 443，不是 8443。</text>
  <text x="60" y="650" font-size="12" fill="#78350F">② firewall-cmd --reload 会冲掉 Docker 的链，容器访问异常时重启一下 Docker 让它重建。</text>
  <text x="60" y="670" font-size="11" fill="#B45309">Docker 29 起实验性支持 nftables 后端，DOCKER-USER 需要迁移，生产升级前先确认策略路径。</text>
</svg>
