<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">吸收比与极化指数：比单个数值更会"看"绝缘</text>
  <text x="480" y="68" text-anchor="middle" font-size="14" fill="#64748b">绝缘好不好，不只看阻值高低，更看加压后阻值随时间上升的快慢</text>

  <!-- 电流三成分 -->
  <rect x="30" y="95" width="440" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="125" font-size="15" font-weight="bold" fill="#1e3a5f">加压后流过绝缘的三种电流</text>
  <rect x="50" y="142" width="400" height="44" rx="6" fill="#dbeafe"/>
  <text x="62" y="162" font-size="13" font-weight="bold" fill="#1d4ed8">① 电容电流</text>
  <text x="62" y="180" font-size="11.5" fill="#1e40af">加压瞬间最大，快速衰减到零（给绝缘"充电"）</text>
  <rect x="50" y="192" width="400" height="44" rx="6" fill="#fef3c7"/>
  <text x="62" y="212" font-size="13" font-weight="bold" fill="#c2410c">② 吸收电流</text>
  <text x="62" y="230" font-size="11.5" fill="#7c2d12">缓慢衰减，反映介质极化——受潮时显著增大</text>
  <rect x="50" y="242" width="400" height="44" rx="6" fill="#dcfce7"/>
  <text x="62" y="262" font-size="13" font-weight="bold" fill="#15803d">③ 泄漏电流</text>
  <text x="62" y="280" font-size="11.5" fill="#14532d">稳定不变，真正反映绝缘的好坏</text>

  <!-- 曲线图 -->
  <rect x="500" y="95" width="430" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="520" y="125" font-size="15" font-weight="bold" fill="#1e3a5f">绝缘电阻随时间上升的曲线</text>
  <!-- 坐标轴 -->
  <line x1="550" y1="340" x2="900" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="340" x2="550" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="344" font-size="12" fill="#64748b">时间</text>
  <text x="548" y="155" text-anchor="end" font-size="12" fill="#64748b">R</text>
  <!-- 良好绝缘曲线（上升快） -->
  <path d="M 558 325 Q 600 240 700 205 Q 800 190 890 188" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="800" y="180" font-size="12" font-weight="bold" fill="#15803d">绝缘良好：上升快</text>
  <!-- 受潮曲线（上升慢） -->
  <path d="M 558 325 Q 620 295 700 280 Q 800 272 890 268" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="800" y="292" font-size="12" font-weight="bold" fill="#b91c1c">受潮：上升慢</text>
  <!-- 15s 60s 标记 -->
  <line x1="620" y1="340" x2="620" y2="333" stroke="#475569" stroke-width="2"/>
  <text x="620" y="356" text-anchor="middle" font-size="11" fill="#475569">15s</text>
  <line x1="710" y1="340" x2="710" y2="333" stroke="#475569" stroke-width="2"/>
  <text x="710" y="356" text-anchor="middle" font-size="11" fill="#475569">60s</text>
  <line x1="870" y1="340" x2="870" y2="333" stroke="#475569" stroke-width="2"/>
  <text x="870" y="356" text-anchor="middle" font-size="11" fill="#475569">10min</text>

  <!-- 两个判据 -->
  <rect x="30" y="405" width="440" height="165" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="30" y="405" width="440" height="38" rx="10" fill="#e0f2fe"/>
  <text x="50" y="431" font-size="16" font-weight="bold" fill="#0e7490">吸收比 K（小电容设备）</text>
  <rect x="50" y="458" width="400" height="48" rx="6" fill="#f0f9ff"/>
  <text x="65" y="488" font-size="19" font-weight="bold" fill="#0e7490">K = R60s / R15s</text>
  <text x="50" y="530" font-size="13" fill="#334155">60 秒与 15 秒读数之比，绝缘良好时明显 &gt; 1</text>
  <text x="50" y="554" font-size="13" font-weight="bold" fill="#dc2626">一般认为 K &lt; 1.3，绝缘可能受潮</text>

  <rect x="490" y="405" width="440" height="165" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="490" y="405" width="440" height="38" rx="10" fill="#ede9fe"/>
  <text x="510" y="431" font-size="16" font-weight="bold" fill="#6d28d9">极化指数 PI（大电容设备）</text>
  <rect x="510" y="458" width="400" height="48" rx="6" fill="#faf5ff"/>
  <text x="525" y="488" font-size="19" font-weight="bold" fill="#6d28d9">PI = R10min / R1min</text>
  <text x="510" y="530" font-size="13" fill="#334155">大型变压器、发电机、长电缆，吸收过程长达数分钟</text>
  <text x="510" y="554" font-size="13" font-weight="bold" fill="#15803d">一般 PI ≥ 2.0 认为绝缘良好</text>

  <text x="480" y="600" text-anchor="middle" font-size="12.5" fill="#64748b">小电容设备测绝缘电阻即可；大电容设备还要看吸收比或极化指数——数字式兆欧表大多能自动算出</text>
</svg>
