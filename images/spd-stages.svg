<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0891b2"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">三级布防：逐层削减，各司其职</text>
  <text x="480" y="68" text-anchor="middle" font-size="14" fill="#64748b">单级 SPD 吃不下直击雷的全部能量，残压也太高——分级保护像过筛子，一级一级把浪涌削薄</text>

  <!-- 防雷分区条 -->
  <text x="30" y="105" font-size="14" font-weight="bold" fill="#1e3a5f">防雷分区（LPZ）与安装位置：</text>
  <rect x="30" y="118" width="230" height="44" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="145" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">LPZ 0 / 0B · 直击雷区</text>
  <text x="145" y="156" text-anchor="middle" font-size="11" fill="#7f1d1d">建筑外、进线入口</text>
  <rect x="370" y="118" width="230" height="44" rx="6" fill="#fef3c7" stroke="#ea580c"/>
  <text x="485" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">LPZ 1 · 总配电区</text>
  <text x="485" y="156" text-anchor="middle" font-size="11" fill="#7c2d12">总配电箱</text>
  <rect x="710" y="118" width="220" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="820" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">LPZ 2 / 3 · 设备区</text>
  <text x="820" y="156" text-anchor="middle" font-size="11" fill="#14532d">分配电箱 / 设备前端</text>

  <!-- 三级卡片 -->
  <!-- T1 -->
  <rect x="30" y="195" width="285" height="300" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="30" y="195" width="285" height="46" rx="10" fill="#dc2626"/>
  <text x="172" y="225" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">T1 · 一级保护</text>
  <text x="50" y="270" font-size="13" font-weight="bold" fill="#1e3a5f">装在哪：</text>
  <text x="50" y="292" font-size="13" fill="#334155">建筑物总配电箱、电源进线处</text>
  <text x="50" y="322" font-size="13" font-weight="bold" fill="#1e3a5f">对付什么：</text>
  <text x="50" y="344" font-size="13" fill="#334155">直击雷的大能量冲击</text>
  <text x="50" y="374" font-size="13" font-weight="bold" fill="#1e3a5f">试验波形：</text>
  <rect x="50" y="386" width="130" height="32" rx="6" fill="#fee2e2"/>
  <text x="115" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">10/350 μs</text>
  <text x="50" y="442" font-size="12" fill="#475569">Iimp ≥ 12.5 kA（每极）</text>
  <text x="50" y="464" font-size="12" fill="#475569">Up ≤ 2.5 kV</text>
  <text x="50" y="486" font-size="12" font-weight="bold" fill="#dc2626">重点：扛能量</text>

  <!-- 箭头 -->
  <line x1="322" y1="345" x2="365" y2="345" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="343" y="330" text-anchor="middle" font-size="10" fill="#0891b2">削减</text>

  <!-- T2 -->
  <rect x="370" y="195" width="285" height="300" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="370" y="195" width="285" height="46" rx="10" fill="#ea580c"/>
  <text x="512" y="225" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">T2 · 二级保护</text>
  <text x="390" y="270" font-size="13" font-weight="bold" fill="#1e3a5f">装在哪：</text>
  <text x="390" y="292" font-size="13" fill="#334155">楼层 / 分配电箱</text>
  <text x="390" y="322" font-size="13" font-weight="bold" fill="#1e3a5f">对付什么：</text>
  <text x="390" y="344" font-size="13" fill="#334155">一级削减后的残余浪涌</text>
  <text x="390" y="374" font-size="13" font-weight="bold" fill="#1e3a5f">试验波形：</text>
  <rect x="390" y="386" width="130" height="32" rx="6" fill="#fef3c7"/>
  <text x="455" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">8/20 μs</text>
  <text x="390" y="442" font-size="12" fill="#475569">In 20~40 kA</text>
  <text x="390" y="464" font-size="12" fill="#475569">Up ≤ 1.5 kV</text>
  <text x="390" y="486" font-size="12" font-weight="bold" fill="#ea580c">重点：削残压</text>

  <line x1="662" y1="345" x2="705" y2="345" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="683" y="330" text-anchor="middle" font-size="10" fill="#0891b2">削减</text>

  <!-- T3 -->
  <rect x="710" y="195" width="220" height="300" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="710" y="195" width="220" height="46" rx="10" fill="#16a34a"/>
  <text x="820" y="225" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">T3 · 三级保护</text>
  <text x="730" y="270" font-size="13" font-weight="bold" fill="#1e3a5f">装在哪：</text>
  <text x="730" y="292" font-size="13" fill="#334155">设备前端、插座处</text>
  <text x="730" y="322" font-size="13" font-weight="bold" fill="#1e3a5f">对付什么：</text>
  <text x="730" y="344" font-size="13" fill="#334155">精细保护终端设备</text>
  <text x="730" y="374" font-size="13" font-weight="bold" fill="#1e3a5f">试验波形：</text>
  <rect x="730" y="386" width="130" height="32" rx="6" fill="#dcfce7"/>
  <text x="795" y="408" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">8/20 / 组合波</text>
  <text x="730" y="442" font-size="12" fill="#475569">Imax 5~10 kA</text>
  <text x="730" y="464" font-size="12" fill="#475569">Up ≤ 1.0 kV</text>
  <text x="730" y="486" font-size="12" font-weight="bold" fill="#16a34a">重点：压残压</text>

  <!-- 波形说明 -->
  <rect x="30" y="520" width="900" height="42" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="50" y="547" font-size="13" fill="#334155">10/350 μs：持续时间长、能量大，模拟直击雷　|　8/20 μs：短促，模拟感应雷与操作过电压</text>
  <text x="480" y="592" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">用 T2 冒充 T1 是常见坑：kA 数看着一样，能量差着几十倍</text>
  <text x="480" y="612" text-anchor="middle" font-size="11" fill="#64748b">两级之间要拉开 ≥10 m 线路距离，或加装退耦器，否则能量配合失效</text>
</svg>
