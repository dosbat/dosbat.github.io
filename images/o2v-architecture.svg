<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1200" height="680" fill="#F8FAFC"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">OpenObserve + Vector：一套搞定日志与指标</text>
  <text x="40" y="74" font-size="14" fill="#64748B">Vector 负责采集与处理，OpenObserve 负责存储、查询与告警；三类信号落到同一份 Parquet</text>

  <!-- 数据来源层 -->
  <text x="40" y="112" font-size="13" font-weight="700" fill="#475569">① 数据来源</text>
  <rect x="40" y="126" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="130" y="158" font-size="13" fill="#0F172A" text-anchor="middle">应用日志文件</text>
  <rect x="236" y="126" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="326" y="158" font-size="13" fill="#0F172A" text-anchor="middle">Docker 容器日志</text>
  <rect x="432" y="126" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="522" y="158" font-size="13" fill="#0F172A" text-anchor="middle">nginx stub_status</text>
  <rect x="628" y="126" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="718" y="158" font-size="13" fill="#0F172A" text-anchor="middle">主机 / 系统指标</text>
  <rect x="824" y="126" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="914" y="158" font-size="13" fill="#0F172A" text-anchor="middle">OTLP traces</text>

  <!-- 箭头 采集层->Vector -->
  <path d="M130,178 L130,214 L560,214 L560,246" stroke="#2563EB" stroke-width="2.5" fill="none"/>
  <path d="M326,178 L326,214" stroke="#2563EB" stroke-width="2.5" fill="none"/>
  <path d="M522,178 L522,214" stroke="#2563EB" stroke-width="2.5" fill="none"/>
  <path d="M718,178 L718,214" stroke="#2563EB" stroke-width="2.5" fill="none"/>
  <path d="M914,178 L914,214 L560,214" stroke="#2563EB" stroke-width="2.5" fill="none"/>
  <path d="M560,238 l-6,10 l12,0 z" fill="#2563EB"/>

  <!-- Vector 处理块 -->
  <rect x="300" y="250" width="600" height="150" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="600" y="282" font-size="18" font-weight="700" fill="#1E40AF" text-anchor="middle">Vector 数据管道（Rust，单二进制）</text>
  <rect x="326" y="300" width="165" height="72" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="408" y="330" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">sources</text>
  <text x="408" y="352" font-size="11" fill="#475569" text-anchor="middle">采集</text>
  <path d="M497,336 L517,336" stroke="#2563EB" stroke-width="2.5"/>
  <path d="M515,332 l6,4 l-6,4 z" fill="#2563EB"/>
  <rect x="521" y="300" width="165" height="72" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="603" y="330" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">transforms</text>
  <text x="603" y="352" font-size="11" fill="#475569" text-anchor="middle">VRL 解析 / 脱敏</text>
  <path d="M692,336 L712,336" stroke="#2563EB" stroke-width="2.5"/>
  <path d="M710,332 l6,4 l-6,4 z" fill="#2563EB"/>
  <rect x="716" y="300" width="158" height="72" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="795" y="330" font-size="14" font-weight="700" fill="#1E40AF" text-anchor="middle">sinks</text>
  <text x="795" y="352" font-size="11" fill="#475569" text-anchor="middle">路由写出</text>

  <!-- 两条写入链路 -->
  <path d="M500,400 L500,432 L360,432 L360,466" stroke="#059669" stroke-width="2.5" fill="none"/>
  <path d="M358,462 l-4,8 l8,0 z" fill="#059669"/>
  <path d="M700,400 L700,432 L840,432 L840,466" stroke="#7C3AED" stroke-width="2.5" fill="none"/>
  <path d="M838,462 l-4,8 l8,0 z" fill="#7C3AED"/>
  <rect x="180" y="470" width="360" height="54" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="360" y="494" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">日志：http sink → /_json</text>
  <text x="360" y="512" font-size="11" fill="#047857" text-anchor="middle">gzip + Basic 认证，流自动创建</text>
  <rect x="660" y="470" width="360" height="54" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="840" y="494" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">指标：prometheus_remote_write</text>
  <text x="840" y="512" font-size="11" fill="#6D28D9" text-anchor="middle">remote_write 接口，关健康检查</text>

  <!-- O2 存储块 -->
  <path d="M360,524 L360,552 L600,552 L600,578" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M840,524 L840,552 L600,552" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M598,574 l-4,8 l8,0 z" fill="#475569"/>
  <rect x="300" y="582" width="600" height="72" rx="14" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  <text x="600" y="611" font-size="17" font-weight="700" fill="#0F172A" text-anchor="middle">OpenObserve 1.0（AGPL 开源版）</text>
  <text x="600" y="637" font-size="12" fill="#475569" text-anchor="middle">Parquet 列存（本地盘或 S3/MinIO） · 日志+指标+追踪统一存储</text>

  <!-- 右侧：查询与告警 -->
  <rect x="950" y="250" width="210" height="150" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="1055" y="282" font-size="14" font-weight="700" fill="#92400E" text-anchor="middle">查询与告警</text>
  <text x="970" y="312" font-size="12" fill="#78350F">SQL 查日志 / 追踪</text>
  <text x="970" y="336" font-size="12" fill="#78350F">PromQL 查指标</text>
  <text x="970" y="360" font-size="12" fill="#78350F">仪表盘 + 实时告警</text>
  <text x="970" y="384" font-size="12" fill="#78350F">SLO + burn-rate</text>
  <path d="M900,618 L1055,618 L1055,404" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/>
  <path d="M1051,408 l4,-8 l4,8 z" fill="#F59E0B"/>

  <text x="40" y="668" font-size="11" fill="#94A3B8">端口：5080 = Web UI + HTTP API ｜ 5081 = gRPC / OTLP traces；本地形态绑 127.0.0.1 + 反代，别裸奔公网</text>
</svg>
