<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1200" height="700" fill="#F8FAFC"/>
  <text x="40" y="48" font-size="27" font-weight="700" fill="#0F172A">采集层怎么选：Filebeat / Elastic Agent / Logstash</text>
  <text x="40" y="78" font-size="14" fill="#64748B">三者是不同层级，不是互相替代：端侧采集、统一 Agent、服务端加工</text>

  <!-- 决策树 -->
  <text x="40" y="116" font-size="14" font-weight="700" fill="#475569">决策路径</text>
  <rect x="40" y="132" width="200" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="140" y="158" font-size="13" font-weight="700" fill="#1E40AF" text-anchor="middle">新项目？</text>
  <text x="140" y="178" font-size="11" fill="#475569" text-anchor="middle">要日志+指标+安全</text>

  <path d="M240,162 L320,162" stroke="#2563EB" stroke-width="2.5"/>
  <path d="M318,158 l6,4 l-6,4 z" fill="#2563EB"/>
  <rect x="324" y="132" width="230" height="60" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <text x="439" y="158" font-size="13" font-weight="700" fill="#065F46" text-anchor="middle">Elastic Agent + Fleet</text>
  <text x="439" y="178" font-size="11" fill="#047857" text-anchor="middle">官方主推，Kibana 集中管策略</text>

  <path d="M554,162 L634,162" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5,4"/>
  <text x="594" y="152" font-size="11" fill="#64748B" text-anchor="middle">已有</text>
  <rect x="638" y="132" width="230" height="60" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="753" y="158" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Filebeat 继续用</text>
  <text x="753" y="178" font-size="11" fill="#64748B" text-anchor="middle">跑得好不必强迁</text>

  <path d="M868,162 L948,162" stroke="#7C3AED" stroke-width="2.5"/>
  <path d="M946,158 l6,4 l-6,4 z" fill="#7C3AED"/>
  <rect x="952" y="132" width="208" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="1056" y="158" font-size="13" font-weight="700" fill="#5B21B6" text-anchor="middle">格式脏 / 多源 syslog</text>
  <text x="1056" y="178" font-size="11" fill="#6D28D9" text-anchor="middle">中间加一层 Logstash</text>

  <!-- 对比表 -->
  <text x="40" y="236" font-size="14" font-weight="700" fill="#475569">三种方案对比</text>
  <rect x="40" y="252" width="1120" height="44" rx="8" fill="#1E293B"/>
  <text x="60" y="280" font-size="13" font-weight="700" fill="#FFFFFF">方案</text>
  <text x="300" y="280" font-size="13" font-weight="700" fill="#FFFFFF">定位</text>
  <text x="580" y="280" font-size="13" font-weight="700" fill="#FFFFFF">适合场景</text>
  <text x="900" y="280" font-size="13" font-weight="700" fill="#FFFFFF">代价</text>

  <rect x="40" y="298" width="1120" height="62" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="60" y="326" font-size="13" font-weight="700" fill="#2563EB">Filebeat</text>
  <text x="300" y="326" font-size="12" fill="#334155">轻量日志搬运工</text>
  <text x="580" y="326" font-size="12" fill="#334155">只要日志、老集群、想少折腾</text>
  <text x="900" y="326" font-size="12" fill="#334155">功能单一，指标安全另装</text>
  <text x="60" y="348" font-size="11" fill="#94A3B8">Beats 仍维护，老教程依然有效</text>

  <rect x="40" y="364" width="1120" height="62" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="60" y="392" font-size="13" font-weight="700" fill="#15803D">Elastic Agent</text>
  <text x="300" y="392" font-size="12" fill="#334155">统一 Agent（日志+指标+安全）</text>
  <text x="580" y="392" font-size="12" fill="#334155">新项目、要 APM/SIEM、集中管理</text>
  <text x="900" y="392" font-size="12" fill="#334155">需部署 Fleet Server，较重</text>
  <text x="60" y="414" font-size="11" fill="#64748B">官方已用 Agent 取代大多数场景的 Beats</text>

  <rect x="40" y="430" width="1120" height="62" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
  <text x="60" y="458" font-size="13" font-weight="700" fill="#6D28D9">Logstash</text>
  <text x="300" y="458" font-size="12" fill="#334155">服务端加工中心</text>
  <text x="580" y="458" font-size="12" fill="#334155">grok 解析、多源汇聚、多下游</text>
  <text x="900" y="458" font-size="12" fill="#334155">多一个 JVM 要养，吃内存</text>
  <text x="60" y="480" font-size="11" fill="#7C3AED">能用 ingest pipeline 在 ES 侧做就不必上</text>

  <rect x="40" y="496" width="1120" height="62" rx="8" fill="#FFF7ED" stroke="#FCD34D" stroke-width="2"/>
  <text x="60" y="524" font-size="13" font-weight="700" fill="#B45309">Filebeat → Kafka → Logstash</text>
  <text x="300" y="524" font-size="12" fill="#334155">带消息队列的管道</text>
  <text x="580" y="524" font-size="12" fill="#334155">高吞吐、要削峰抗堆积</text>
  <text x="900" y="524" font-size="12" fill="#334155">组件最多，运维最重</text>
  <text x="60" y="546" font-size="11" fill="#A16207">中小规模不必上，日志量上一个量级再考虑</text>

  <!-- 底部结论 -->
  <rect x="40" y="582" width="1120" height="78" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="60" y="610" font-size="14" font-weight="700" fill="#1E40AF">一句话结论</text>
  <text x="60" y="636" font-size="12" fill="#1E3A8A">新项目要日志+指标+安全 → Elastic Agent；已有 Filebeat → 继续用；格式脏要 grok 解析 → 加 Logstash；单纯转发且格式规整 → Filebeat 直写 ES</text>
  <text x="60" y="654" font-size="11" fill="#64748B">采集端永远在 ES 之后部署：证书与令牌要先备好，否则换新证书后 Agent 得重装</text>

  <text x="40" y="686" font-size="11" fill="#94A3B8">采集层选型决策 · 整理于 2026-11</text>
</svg>
