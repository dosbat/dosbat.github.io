<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <pattern id="cold" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#93c5fd" stroke-width="4"/>
    </pattern>
    <pattern id="hot" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="20" fill="#fee2e2"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#fca5a5" stroke-width="4"/>
    </pattern>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="480" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1e3a5f">机柜验收：U 位立面图 + 冷热通道</text>
  <text x="480" y="74" text-anchor="middle" font-size="14" fill="#64748b">出一张正立面图标注 U 位与资产编号，比 Excel 清单直观</text>

  <!-- 冷通道 -->
  <rect x="120" y="110" width="130" height="360" fill="url(#cold)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="185" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">冷通道</text>
  <text x="185" y="295" text-anchor="middle" font-size="13" fill="#1d4ed8" transform="rotate(-90,185,295)">18~27℃</text>
  <line x1="250" y1="200" x2="290" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowblue)"/>
  <line x1="250" y1="300" x2="290" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowblue)"/>
  <line x1="250" y1="400" x2="290" y2="400" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowblue)"/>

  <!-- 机柜 -->
  <rect x="295" y="108" width="230" height="364" rx="6" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="410" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">机柜 A-01（正立面）</text>

  <!-- U位格子，从下往上 -->
  <g font-size="11" fill="#475569" text-anchor="middle">
    <!-- 42U 顶部 -->
    <rect x="305" y="118" width="210" height="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="410" y="132">42U 盲板（空闲U位必装）</text>
    <rect x="305" y="140" width="210" height="18" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="410" y="153">41U 核心交换机</text>
    <rect x="305" y="160" width="210" height="18" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
    <text x="410" y="173">40U 接入交换机</text>
    <rect x="305" y="180" width="210" height="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="410" y="191">39U 理线器（1U）</text>
    <rect x="305" y="196" width="210" height="20" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="410" y="210">38U 配线架（1U）</text>
    <rect x="305" y="218" width="210" height="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
    <text x="410" y="229">37U 理线器（1U）</text>
    <rect x="305" y="234" width="210" height="20" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
    <text x="410" y="248">36U 配线架（1U）</text>
    <!-- 服务器区 -->
    <rect x="305" y="256" width="210" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="305" y1="276" x2="515" y2="276" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="305" y1="296" x2="515" y2="296" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="305" y1="316" x2="515" y2="316" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="305" y1="336" x2="515" y2="336" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="305" y1="356" x2="515" y2="356" stroke="#cbd5e1" stroke-width="1"/>
    <text x="410" y="270">35~31U 服务器区</text>
    <text x="410" y="310">预留扩容 U 位</text>
    <text x="410" y="350">设备不挡进风面</text>
    <!-- PDU -->
    <rect x="305" y="380" width="210" height="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="410" y="394">30U 盲板</text>
    <rect x="305" y="404" width="210" height="22" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
    <text x="410" y="419">A路 PDU（左）/ B路 PDU（右）</text>
    <rect x="305" y="430" width="210" height="34" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
    <text x="410" y="451">底部固定 + 接地跨接</text>
  </g>

  <!-- 热通道 -->
  <line x1="525" y1="200" x2="565" y2="200" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <line x1="525" y1="300" x2="565" y2="300" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <line x1="525" y1="400" x2="565" y2="400" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowred)"/>
  <rect x="570" y="110" width="130" height="360" fill="url(#hot)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="635" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">热通道</text>
  <text x="635" y="295" text-anchor="middle" font-size="13" fill="#b91c1c" transform="rotate(-90,635,295)">后排出风</text>

  <!-- 右侧要点 -->
  <rect x="730" y="110" width="210" height="360" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text x="835" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e7490">验收四个硬指标</text>
  <text x="748" y="178" font-size="12" fill="#334155">1. 成排柜面平齐</text>
  <text x="748" y="198" font-size="12" fill="#334155">   门开合无干涉</text>
  <text x="748" y="234" font-size="12" fill="#334155">2. 前后通道净宽</text>
  <text x="748" y="254" font-size="12" fill="#334155">   满足设计</text>
  <text x="748" y="290" font-size="12" fill="#334155">3. 空闲U位装盲板</text>
  <text x="748" y="310" font-size="12" fill="#334155">   线缆不堵风道</text>
  <text x="748" y="346" font-size="12" fill="#334155">4. 底部固定抗震</text>
  <text x="748" y="366" font-size="12" fill="#334155">   孔洞防火封堵</text>
  <text x="748" y="408" font-size="11" fill="#94a3b8">环境：18~27℃</text>
  <text x="748" y="428" font-size="11" fill="#94a3b8">露点 5.5~15℃</text>
  <text x="748" y="448" font-size="11" fill="#94a3b8">RH ≤ 60%</text>

  <text x="480" y="512" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">配电架 1U : 理线器 1U 交替预留 —— 后期换设备不用重新数格子</text>
</svg>
