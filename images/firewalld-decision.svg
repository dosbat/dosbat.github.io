<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563EB"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="660" fill="#F8FAFC"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0F172A">先分清需求：三种限制，三种写法</text>
  <text x="40" y="76" font-size="14" fill="#64748B">「限制 IP 和端口」在 firewalld 里是三件不同的事，先对号入座再动手</text>

  <!-- 列1 -->
  <rect x="40" y="105" width="350" height="76" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="60" y="134" font-size="14" font-weight="700" fill="#1E40AF">① 只让某些 IP 访问某端口</text>
  <text x="60" y="160" font-size="12" fill="#475569">如：仅跳板机可连 SSH</text>
  <line x1="215" y1="183" x2="215" y2="205" stroke="#2563EB" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="40" y="207" width="350" height="94" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="60" y="236" font-size="15" font-weight="700" fill="#0F172A">rich rule 富规则</text>
  <text x="60" y="262" font-size="12" fill="#475569">少量 IP，精确到「IP + 端口」</text>
  <text x="60" y="286" font-size="11" fill="#94A3B8">写 source address 必须带 family</text>
  <rect x="40" y="321" width="350" height="122" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="60" y="348" font-size="12" fill="#334155">firewall-cmd --permanent \</text>
  <text x="60" y="372" font-size="12" fill="#334155">  --add-rich-rule='rule family="ipv4"</text>
  <text x="60" y="396" font-size="12" fill="#334155">  source address=203.0.113.10/32</text>
  <text x="60" y="420" font-size="12" fill="#334155">  port port=22 protocol=tcp accept'</text>

  <!-- 列2 -->
  <rect x="425" y="105" width="350" height="76" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="445" y="134" font-size="14" font-weight="700" fill="#5B21B6">② 整机级黑白名单</text>
  <text x="445" y="160" font-size="12" fill="#475569">如：内网全放行、公网全拒绝</text>
  <line x1="600" y1="183" x2="600" y2="205" stroke="#7C3AED" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="425" y="207" width="350" height="94" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="445" y="236" font-size="15" font-weight="700" fill="#0F172A">zone source + target</text>
  <text x="445" y="262" font-size="12" fill="#475569">按信任级别整体管控</text>
  <text x="445" y="286" font-size="11" fill="#94A3B8">大量 IP 再配 ipset 集合引用</text>
  <rect x="425" y="321" width="350" height="122" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="445" y="348" font-size="12" fill="#334155">firewall-cmd --permanent \</text>
  <text x="445" y="372" font-size="12" fill="#334155">  --zone=trusted --add-source=10.20.0.0/16</text>
  <text x="445" y="396" font-size="12" fill="#334155">firewall-cmd --permanent \</text>
  <text x="445" y="420" font-size="12" fill="#334155">  --zone=public --set-target=drop</text>

  <!-- 列3 -->
  <rect x="810" y="105" width="350" height="76" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="830" y="134" font-size="14" font-weight="700" fill="#047857">③ 端口对所有人开放</text>
  <text x="830" y="160" font-size="12" fill="#475569">如：网站开放 80 / 443</text>
  <line x1="985" y1="183" x2="985" y2="205" stroke="#10B981" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="810" y="207" width="350" height="94" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="830" y="236" font-size="15" font-weight="700" fill="#0F172A">--add-port / --add-service</text>
  <text x="830" y="262" font-size="12" fill="#475569">不涉及来源 IP，只管端口开关</text>
  <text x="830" y="286" font-size="11" fill="#94A3B8">服务名比端口更稳（可含多端口）</text>
  <rect x="810" y="321" width="350" height="122" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="830" y="348" font-size="12" fill="#334155">firewall-cmd --permanent \</text>
  <text x="830" y="372" font-size="12" fill="#334155">  --add-service=http</text>
  <text x="830" y="396" font-size="12" fill="#334155">firewall-cmd --permanent \</text>
  <text x="830" y="420" font-size="12" fill="#334155">  --add-service=https</text>

  <!-- 四层模型 -->
  <text x="40" y="486" font-size="16" font-weight="700" fill="#0F172A">firewalld 四层模型（由粗到细）</text>
  <rect x="40" y="502" width="265" height="70" rx="8" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="60" y="530" font-size="14" font-weight="700" fill="#1E40AF">zone 区域</text>
  <text x="60" y="554" font-size="11" fill="#475569">按信任级别分组</text>
  <rect x="325" y="502" width="265" height="70" rx="8" fill="#E0E7FF" stroke="#A5B4FC"/>
  <text x="345" y="530" font-size="14" font-weight="700" fill="#4338CA">service / port</text>
  <text x="345" y="554" font-size="11" fill="#475569">端口开关</text>
  <rect x="610" y="502" width="265" height="70" rx="8" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="630" y="530" font-size="14" font-weight="700" fill="#15803D">rich rule 富规则</text>
  <text x="630" y="554" font-size="11" fill="#475569">IP + 端口精确控制</text>
  <rect x="895" y="502" width="265" height="70" rx="8" fill="#FEF3C7" stroke="#FCD34D"/>
  <text x="915" y="530" font-size="14" font-weight="700" fill="#B45309">ipset 集合</text>
  <text x="915" y="554" font-size="11" fill="#475569">批量 IP 引用</text>

  <rect x="40" y="594" width="1120" height="50" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="60" y="624" font-size="12" fill="#92400E">流程：runtime 先试 → permanent 固化 → --reload 生效。远程改防火墙规则，记得先留控制台退路。</text>
</svg>
