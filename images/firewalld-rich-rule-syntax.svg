<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect x="0" y="0" width="1200" height="600" fill="#F8FAFC"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0F172A">富规则语法骨架：一条规则拆成六段</text>
  <text x="40" y="76" font-size="14" fill="#64748B">选项必须紧跟对应元素；写了 source address 就必须写 family</text>

  <!-- 六段 -->
  <g>
    <rect x="40" y="130" width="170" height="186" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="125" y="172" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">rule</text>
    <line x1="60" y1="188" x2="190" y2="188" stroke="#E2E8F0"/>
    <text x="125" y="222" font-size="12" fill="#0F172A" text-anchor="middle">固定开头</text>
    <text x="125" y="266" font-size="11" fill="#64748B" text-anchor="middle">一条富规则的起点，</text>
    <text x="125" y="286" font-size="11" fill="#64748B" text-anchor="middle">整行作为单个字符串传入</text>

    <rect x="225" y="130" width="170" height="186" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="310" y="172" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">family</text>
    <line x1="245" y1="188" x2="375" y2="188" stroke="#E2E8F0"/>
    <text x="310" y="222" font-size="12" fill="#0F172A" text-anchor="middle">family="ipv4"</text>
    <text x="310" y="266" font-size="11" fill="#64748B" text-anchor="middle">涉及 source / 端口转发</text>
    <text x="310" y="286" font-size="11" fill="#DC2626" text-anchor="middle">必填，否则 invalid rule</text>

    <rect x="410" y="130" width="170" height="186" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="495" y="172" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">source</text>
    <line x1="430" y1="188" x2="560" y2="188" stroke="#E2E8F0"/>
    <text x="495" y="222" font-size="12" fill="#0F172A" text-anchor="middle">source address="..."</text>
    <text x="495" y="266" font-size="11" fill="#64748B" text-anchor="middle">来源 IP / 网段 / ipset，</text>
    <text x="495" y="286" font-size="11" fill="#64748B" text-anchor="middle">可加 not 取反</text>

    <rect x="595" y="130" width="170" height="186" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="680" y="172" font-size="18" font-weight="700" fill="#0891B2" text-anchor="middle">port</text>
    <line x1="615" y1="188" x2="745" y2="188" stroke="#E2E8F0"/>
    <text x="680" y="222" font-size="12" fill="#0F172A" text-anchor="middle">port port="22"</text>
    <text x="680" y="266" font-size="11" fill="#64748B" text-anchor="middle">可写范围 8000-8080，</text>
    <text x="680" y="286" font-size="11" fill="#64748B" text-anchor="middle">protocol=tcp|udp</text>

    <rect x="780" y="130" width="170" height="186" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="865" y="172" font-size="18" font-weight="700" fill="#EA580C" text-anchor="middle">log</text>
    <line x1="800" y1="188" x2="930" y2="188" stroke="#E2E8F0"/>
    <text x="865" y="222" font-size="12" fill="#0F172A" text-anchor="middle">log prefix="FW"</text>
    <text x="865" y="266" font-size="11" fill="#64748B" text-anchor="middle">可加 level 与 limit</text>
    <text x="865" y="286" font-size="11" fill="#64748B" text-anchor="middle">如 limit value="2/m"</text>

    <rect x="965" y="130" width="170" height="186" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1050" y="172" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">动作</text>
    <line x1="985" y1="188" x2="1115" y2="188" stroke="#E2E8F0"/>
    <text x="1050" y="222" font-size="12" fill="#0F172A" text-anchor="middle">accept|reject|drop</text>
    <text x="1050" y="266" font-size="11" fill="#64748B" text-anchor="middle">首条匹配即终止，</text>
    <text x="1050" y="286" font-size="11" fill="#64748B" text-anchor="middle">后面的规则不再看</text>
  </g>

  <rect x="40" y="348" width="1120" height="88" rx="10" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="60" y="380" font-size="14" font-weight="700" fill="#B91C1C">⚠ first match wins：多条富规则冲突时，第一条匹配的生效</text>
  <text x="60" y="408" font-size="12" fill="#7F1D1D">一旦被 drop 命中，后面的 accept 根本没机会执行 —— 别写「先全封再开小口」这种反向逻辑。</text>

  <rect x="40" y="456" width="1120" height="112" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
  <text x="60" y="484" font-size="13" font-weight="700" fill="#0F172A">完整示例：SSH 只对跳板机开放</text>
  <text x="60" y="514" font-size="13" fill="#1E40AF">rule family="ipv4" source address="203.0.113.10/32" port port="22" protocol="tcp" accept</text>
  <text x="60" y="544" font-size="11" fill="#64748B">查询：firewall-cmd --list-rich-rules　删除：--remove-rich-rule 后接完全相同的字符串（没有修改，只能删了重加）</text>
</svg>
