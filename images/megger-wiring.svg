<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="640" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">L、E、G 三个端子怎么接</text>
  <text x="480" y="68" text-anchor="middle" font-size="14" fill="#64748b">L 接导体、E 接外壳/大地、G 接屏蔽层——G 端用不用，是新手和老手的分水岭</text>

  <!-- 端子图例 -->
  <rect x="30" y="95" width="900" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="70" cy="120" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="70" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">L</text>
  <text x="95" y="125" font-size="13" fill="#334155">线路端 → 接被测导体（绕组、芯线、相线）</text>
  <circle cx="400" cy="120" r="15" fill="#fef3c7" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">E</text>
  <text x="425" y="125" font-size="13" fill="#334155">接地端 → 接外壳裸金属或大地</text>
  <circle cx="700" cy="120" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="700" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">G</text>
  <text x="725" y="125" font-size="13" fill="#334155">屏蔽端 → 接屏蔽层</text>

  <!-- 场景1：线路对地 -->
  <rect x="30" y="165" width="290" height="215" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="165" width="290" height="36" rx="10" fill="#f1f5f9"/>
  <text x="175" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">场景 1：线路对地绝缘</text>
  <!-- 摇表 -->
  <rect x="50" y="225" width="70" height="90" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="85" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">摇表</text>
  <text x="85" y="288" text-anchor="middle" font-size="11" fill="#64748b">L  E</text>
  <!-- 相线 -->
  <rect x="185" y="225" width="110" height="45" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="240" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">被测相线</text>
  <!-- 大地 -->
  <rect x="185" y="290" width="110" height="25" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="240" y="307" text-anchor="middle" font-size="11" fill="#15803d">大地 / PE</text>
  <line x1="120" y1="245" x2="185" y2="245" stroke="#dc2626" stroke-width="2"/>
  <line x1="120" y1="285" x2="185" y2="303" stroke="#16a34a" stroke-width="2"/>
  <text x="175" y="360" text-anchor="middle" font-size="12" fill="#64748b">只用 L、E，G 一般不接</text>

  <!-- 场景2：电机 -->
  <rect x="335" y="165" width="290" height="215" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="335" y="165" width="290" height="36" rx="10" fill="#f1f5f9"/>
  <text x="480" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">场景 2：电机绕组对地</text>
  <rect x="355" y="225" width="70" height="90" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="390" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">摇表</text>
  <text x="390" y="288" text-anchor="middle" font-size="11" fill="#64748b">L  E</text>
  <!-- 电机 -->
  <circle cx="520" cy="270" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="520" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">电机</text>
  <text x="520" y="283" text-anchor="middle" font-size="10" fill="#1e40af">绕组端子</text>
  <rect x="480" y="320" width="80" height="20" rx="3" fill="#94a3b8"/>
  <text x="520" y="334" text-anchor="middle" font-size="10" fill="#ffffff">机壳(刮漆)</text>
  <line x1="425" y1="245" x2="478" y2="245" stroke="#dc2626" stroke-width="2"/>
  <line x1="425" y1="285" x2="478" y2="325" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="360" text-anchor="middle" font-size="12" fill="#64748b">E 接机壳裸金属，不能接在漆面上</text>

  <!-- 场景3：电缆 + G -->
  <rect x="640" y="165" width="290" height="215" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="640" y="165" width="290" height="36" rx="10" fill="#dcfce7"/>
  <text x="785" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">场景 3：电缆芯线对护套（用 G）</text>
  <rect x="660" y="225" width="60" height="95" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="690" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">摇表</text>
  <text x="690" y="282" text-anchor="middle" font-size="10" fill="#64748b">L E G</text>
  <!-- 电缆剖面 -->
  <circle cx="830" cy="270" r="48" fill="#fef3c7" stroke="#ea580c" stroke-width="3"/>
  <circle cx="830" cy="270" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="830" cy="270" r="12" fill="#dc2626"/>
  <text x="830" y="275" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">芯</text>
  <text x="830" y="335" text-anchor="middle" font-size="10" fill="#9a3412">绝缘层 / 护套</text>
  <line x1="720" y1="240" x2="818" y2="265" stroke="#dc2626" stroke-width="2"/>
  <line x1="720" y1="285" x2="782" y2="305" stroke="#16a34a" stroke-width="2"/>
  <line x1="720" y1="310" x2="800" y2="240" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="785" y="360" text-anchor="middle" font-size="11" fill="#0e7490">G 接绝缘表面，旁路表面漏电</text>

  <!-- G端原理说明 -->
  <rect x="30" y="400" width="900" height="205" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <rect x="30" y="400" width="900" height="38" rx="10" fill="#e0f2fe"/>
  <text x="50" y="426" font-size="16" font-weight="bold" fill="#0e7490">G 端到底起什么作用？</text>
  <text x="50" y="462" font-size="13.5" fill="#334155">测电缆绝缘时，电流有两条路：一条"穿过绝缘体内部"（体电流），一条"沿绝缘表面爬过去"（表面电流）。</text>
  <text x="50" y="490" font-size="13.5" fill="#334155">表面受潮、脏污时后者很大。不接 G，测到的是体电阻与表面电阻的并联值，偏小得离谱，让人误判电缆内部受潮。</text>
  <rect x="50" y="510" width="860" height="46" rx="6" fill="#f0fdf9" stroke="#0d9488"/>
  <text x="65" y="530" font-size="13" font-weight="bold" fill="#0f766e">接上 G 端：表面电流被"抄近道"引回发电机，不经过测量线圈</text>
  <text x="65" y="550" font-size="12" fill="#115e59">读数只反映真实的体积绝缘电阻——这是测电缆、测潮湿设备的关键</text>
  <text x="480" y="585" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">口诀：一般测量只用 L、E；测电缆、测潮湿脏污设备，务必加 G</text>
</svg>
