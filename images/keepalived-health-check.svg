<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2563EB"/></marker>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#10B981"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="660" fill="#F8FAFC"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#0F172A">健康检查与优先级计算</text>
  <text x="40" y="76" font-size="14" fill="#64748B">track_script 让「服务异常」也能触发漂移，weight 的绝对值必须大于主备优先级差</text>

  <!-- left flow -->
  <g>
    <rect x="40" y="110" width="330" height="62" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="60" y="138" font-size="14" font-weight="700" fill="#1E40AF">1 · 每 2 秒执行一次</text>
    <text x="60" y="160" font-size="12" fill="#475569">curl 本机 /healthz 或 pgrep nginx</text>

    <line x1="205" y1="174" x2="205" y2="196" stroke="#2563EB" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="40" y="198" width="330" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="60" y="226" font-size="14" font-weight="700" fill="#0F172A">2 · 失败累计 fall 2 次</text>
    <text x="60" y="248" font-size="12" fill="#475569">避免单次抖动误切换</text>

    <line x1="205" y1="262" x2="205" y2="284" stroke="#2563EB" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="40" y="286" width="330" height="62" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
    <text x="60" y="314" font-size="14" font-weight="700" fill="#9A3412">3 · weight -20 生效</text>
    <text x="60" y="336" font-size="12" fill="#475569">110 - 20 = 90（有效优先级）</text>

    <line x1="205" y1="350" x2="205" y2="372" stroke="#EA580C" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="40" y="374" width="330" height="62" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="60" y="402" font-size="14" font-weight="700" fill="#0F172A">4 · 90 小于备机 100</text>
    <text x="60" y="424" font-size="12" fill="#475569">备机赢得选举，接管 VIP</text>

    <line x1="205" y1="438" x2="205" y2="460" stroke="#10B981" stroke-width="2" marker-end="url(#ar2)"/>

    <rect x="40" y="462" width="330" height="62" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="60" y="490" font-size="14" font-weight="700" fill="#047857">5 · rise 2 次成功后回权</text>
    <text x="60" y="512" font-size="12" fill="#475569">恢复 110，nopreempt 下不回切</text>
  </g>

  <!-- right priority table -->
  <text x="420" y="126" font-size="16" font-weight="700" fill="#0F172A">优先级账本（priority 110 / 100）</text>
  <rect x="420" y="142" width="740" height="46" fill="#1E40AF" rx="8"/>
  <text x="440" y="171" font-size="13" font-weight="700" fill="#FFFFFF">场景</text>
  <text x="760" y="171" font-size="13" font-weight="700" fill="#FFFFFF">节点 A</text>
  <text x="950" y="171" font-size="13" font-weight="700" fill="#FFFFFF">节点 B</text>
  <g font-size="13" fill="#334155">
    <rect x="420" y="190" width="740" height="44" fill="#FFFFFF"/>
    <text x="440" y="218">一切正常</text><text x="760" y="218" fill="#1E40AF" font-weight="700">110 → 持 VIP</text><text x="950" y="218">100 → BACKUP</text>
    <rect x="420" y="234" width="740" height="44" fill="#F1F5F9"/>
    <text x="440" y="262">A 的 Nginx 挂了</text><text x="760" y="262" fill="#EA580C" font-weight="700">90 → 让出</text><text x="950" y="262" fill="#047857" font-weight="700">100 → 接管</text>
    <rect x="420" y="278" width="740" height="44" fill="#FFFFFF"/>
    <text x="440" y="306">A 整机宕机</text><text x="760" y="306" fill="#EF4444" font-weight="700">无通告 → 超时</text><text x="950" y="306" fill="#047857" font-weight="700">100 → 接管</text>
  </g>
  <rect x="420" y="322" width="740" height="52" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="440" y="346" font-size="13" font-weight="700" fill="#B91C1C">反例：weight 只写 -5</text>
  <text x="440" y="366" font-size="12" fill="#7F1D1D">A 降到 105 仍高于 B 的 100，VIP 纹丝不动 —— 脚本明明在报失败却不切换，是最常见的配置错误。</text>

  <!-- two failure modes -->
  <text x="420" y="412" font-size="16" font-weight="700" fill="#0F172A">两条独立的故障判定路径</text>
  <rect x="420" y="428" width="360" height="104" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="440" y="456" font-size="14" font-weight="700" fill="#1E40AF">机器级：VRRP 通告超时</text>
  <text x="440" y="480" font-size="12" fill="#475569">宕机 / 断网 / 防火墙拦了协议 112</text>
  <text x="440" y="502" font-size="12" fill="#475569">备机等 3×advert_int + skew_time</text>
  <text x="440" y="522" font-size="11" fill="#94A3B8">无需脚本，keepalived 自带</text>

  <rect x="800" y="428" width="360" height="104" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="820" y="456" font-size="14" font-weight="700" fill="#EA580C">服务级：track_script 降权</text>
  <text x="820" y="480" font-size="12" fill="#475569">进程在、端口不通、 upstream 全挂</text>
  <text x="820" y="502" font-size="12" fill="#475569">主动降优先级，让备机赢得选举</text>
  <text x="820" y="522" font-size="11" fill="#94A3B8">只配 VRRP 不配脚本 = 只防宕机</text>

  <!-- footer -->
  <rect x="40" y="560" width="1120" height="76" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="60" y="588" font-size="13" font-weight="700" fill="#1E40AF">脚本安全</text>
  <text x="60" y="610" font-size="12" fill="#1E3A8A">新版 keepalived 默认校验脚本权限：脚本必须 root 所有、非全局可写，并在 global_defs 里配 enable_script_security + script_user。</text>
  <text x="60" y="628" font-size="12" fill="#64748B">日志出现 "Disabling track script ... for security reasons" 就是踩了这条，脚本用了绝对路径也没用。</text>
</svg>
